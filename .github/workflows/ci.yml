# CI: tests + repository hygiene check.
# The full pytest suite is hermetic — Ollama/Foundry boundaries are faked or
# HTTP-intercepted, so no live model services are needed.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Repository hygiene / secret scan
        run: python scripts/check_repository.py
